<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultramacho</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#ECE3C4;--card:#fffaebcc;--text:#2A0A06;--sub:#5C4636;--acc:#4C5A08}
@media (prefers-color-scheme:dark){:root{--bg:#1A0605;--card:#2209068c;--text:#F3ECD8;--sub:#D0C3AC;--acc:#BDD630}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(70% 45% at 8% 6%,#bdd6304d,transparent 70%),radial-gradient(90% 55% at 30% 100%,#8c1e1640,transparent 70%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff3;border-radius:24px;padding:20px 22px;margin:14px 0}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}h2{font-size:18px;margin:22px 0 6px}p{margin:8px 0}
.sub{color:var(--sub);font-size:14px}.badge{display:inline-block;background:var(--acc);color:#1A0605;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
a{color:var(--acc)}footer{color:var(--sub);font-size:13px;text-align:center;margin-top:30px}
</style></head><body><main><div class="card"><h1>Ultramacho</h1><p>A rede social dos atletas amadores: academia, CrossFit, corrida, trilha e ciclismo.</p><p class="sub">Em teste fechado.</p><p><a href="privacidade.html">Termos de Uso e Política de Privacidade</a></p></div><footer>Ultramacho · Aventura na Natureza</footer></main></body></html>
